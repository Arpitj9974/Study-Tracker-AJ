<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1F1B38"/>
      <stop offset="100%" stop-color="#0A0C10"/>
    </radialGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- App Icon Background Circle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#ringGrad)" stroke-width="4" opacity="0.4"/>
  
  <!-- Outer Aura Glow -->
  <circle cx="256" cy="256" r="160" fill="#7C3AED" opacity="0.15" filter="url(#glow)"/>
  
  <!-- Stylized Lightning Bolt (AspirantFlow Emblem) -->
  <path d="M280 64 L140 272 L250 272 L220 448 L372 232 L260 232 Z" 
        fill="url(#boltGrad)" filter="url(#glow)"/>
</svg>
